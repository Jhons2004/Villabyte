# Render Blueprint para una cuenta/workspace exclusivo de Villabyte.
# No modifica los servicios DSNC-360.
# Crear desde Render > New > Blueprint, vinculado a este repositorio.
# Se deja sin autodespliegue hasta completar build y pruebas.
services:
  - type: web
    name: villabyte
    runtime: node
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: off
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: jonasvillavicencio845@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_APPS_SCRIPT_URL
        value: https://script.google.com/macros/s/AKfycbznNNt_-UqwNrL9XDnodbrfHi9KrHtCH8xRONz7N7seKT1jSPARnPR2mycLCT1Sk-RR/exec
      - key: GOOGLE_APPS_SCRIPT_KEY
        sync: false
      - key: GOOGLE_SCRIPT_REPLY_ENABLED
        value: "false"
      - key: GOOGLE_APPS_SCRIPT_REPLY_KEY
        sync: false
