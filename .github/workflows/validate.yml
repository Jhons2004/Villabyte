name: Validar Villabyte

on:
  push:
    branches:
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar tipos
        run: npm run lint
      - name: Compilar frontend y servidor
        run: npm run build
